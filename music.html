<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meine Lieblingsmusik</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      text-align: center;
    }

    .description {
      margin: 0 0 25px;
      text-align: center;
      color: #6e6e73;
      font-size: 16px;
    }

    .apple-music-player {
      width: 100%;
    }

    .apple-music-player iframe {
      display: block;
      width: 100%;
      height: 450px;
      border: 0;
      border-radius: 12px;
    }

    .link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #007aff;
      text-decoration: none;
      font-size: 14px;
    }

    .link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
      }

      .apple-music-player iframe {
        height: 450px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <h1>Meine Lieblingsmusik</h1>

      <p class="description">
        Hier findest du meine Favoriten.
      </p>

      <div class="apple-music-player">

        <iframe
          src="https://embed.music.apple.com/de/playlist/lieblingstitel/pl.u-r0UlKrEm"
          allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
          frameborder="0"
          sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation">
        </iframe>

      </div>

      <a
        class="link"
        href="https://music.apple.com/de/playlist/lieblingstitel/pl.u-r0UlKrEm"
        target="_blank"
        rel="noopener noreferrer">
        Playlist in Apple Music öffnen
      </a>

    </section>

  </main>

</body>
</html>
