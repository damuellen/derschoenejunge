<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meine Lieblingsmusik</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, 0.72);
      --text: #111111;
      --secondary: #6e6e73;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
      --accent: #fa2d48;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0d;
        --card: rgba(28, 28, 30, 0.78);
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --border: rgba(255, 255, 255, 0.10);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        --accent: #ff375f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(250, 45, 72, 0.15),
          transparent 40%
        ),
        var(--bg);

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    .page {
      width: 100%;
      max-width: 760px;
    }

    /* Header */

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(250, 45, 72, 0.5);
    }

    h1 {
      margin: 0;

      font-size: clamp(38px, 8vw, 64px);
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 500px;

      color: var(--secondary);
      font-size: 17px;
      line-height: 1.5;
    }

    /* Music card */

    .music-card {
      background: var(--card);
      border: 1px solid var(--border);

      border-radius: 28px;
      padding: 18px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .player-wrapper {
      overflow: hidden;
      border-radius: 18px;
      background: #000;
    }

    .player-wrapper iframe {
      display: block;
      width: 100%;
      height: 450px;
      border: 0;
    }

    /* Footer */

    .footer {
      text-align: center;
      margin-top: 22px;

      color: var(--secondary);
      font-size: 13px;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text);
    }

    /* Mobile */

    @media (max-width: 600px) {
      body {
        padding: 24px 14px;
      }

      .header {
        margin-bottom: 20px;
      }

      .music-card {
        padding: 10px;
        border-radius: 22px;
      }

      .player-wrapper {
        border-radius: 15px;
      }

      .player-wrapper iframe {
        height: 450px;
      }

      .subtitle {
        font-size: 15px;
      }
    }

    /* Weniger Animationen, wenn vom System gewünscht */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="eyebrow">
        Der schöne Junge
      </div>

      <h1>Meine Lieblingsmusik</h1>

      <p class="subtitle">
        Eine Playlist mit Songs, die ich immer wieder hören kann.
      </p>

    </header>
	  
	<h2>Spotify</h2> 
    <section class="music-card">

      <div class="player-wrapper">

    <iframe data-testid="embed-iframe" style="border-radius:12px" 
		 src="https://open.spotify.com/embed/playlist/3MfCRGELme4XohoT5rS3bf?utm_source=generator&si=2aa4cf137d0545de" 
		 width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
	  </iframe>

      </div>

    </section>
    <h2>Apple Music</h2> 
    <section class="music-card">

      <div class="player-wrapper">

        <iframe
          allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
          loading="lazy"
          sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
          src="https://embed.music.apple.com/de/playlist/lieblingstitel/pl.u-r0UlKrEm">
        </iframe>

      </div>

    </section>

    <footer class="footer">
	  <a class="Analytics" href="https://www.simpleanalytics.com?utm_source=derschoenejunge.de&utm_content=badge" referrerpolicy="origin"
        target="_blank" style="margin-right: 20px;">
        <picture>
          <source srcset="https://simpleanalyticsbadges.com/derschoenejunge.de?mode=dark&radius=6"
            media="(prefers-color-scheme: dark)" />
          <img src="https://simpleanalyticsbadges.com/derschoenejunge.de?mode=light&radius=6" loading="lazy"
            referrerpolicy="no-referrer" crossorigin="anonymous" />
        </picture>
      </a>
    </footer>

  </main>

</body>
</html>
