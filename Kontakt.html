<!DOCTYPE html>
<html lang="de">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Schick mir doch ein Foto</title>

   <style>
      :root {
         color-scheme: light dark;
         --bg: #f5f5f7;
         --surface: rgba(255, 255, 255, .72);
         --text: #111;
         --muted: #6e6e73;
         --border: rgba(0, 0, 0, .08);
         --accent: #fa2d48;
         --accent-light: #ff7185;
         --shadow: 0 30px 90px rgba(0, 0, 0, .12);
      }

      svg {
         fill: #111;
      }

      @media (prefers-color-scheme: dark) {
         :root {
            --bg: #08080a;
            --surface: rgba(24, 24, 27, .72);
            --text: #f5f5f7;
            --muted: #a1a1a6;
            --border: rgba(255, 255, 255, .09);
            --accent: #ff375f;
            --accent-light: #ff7185;
            --shadow: 0 30px 100px rgba(0, 0, 0, .45);
         }

         svg {
            fill: #f5f5f7;
         }
      }

      * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      html {
         scroll-behavior: smooth;
      }

      body {
         min-height: 100vh;
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
            "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
         color: var(--text);
         background: var(--bg);
         overflow-x: hidden;
         transition: background .4s ease, color .4s ease;
      }

      a {
         color: inherit;
         text-decoration: none;
      }

      .background {
         position: fixed;
         inset: 0;
         z-index: -2;
         overflow: hidden;
         pointer-events: none;
      }

      .orb {
         position: absolute;
         border-radius: 50%;
         filter: blur(110px);
      }

      .orb-one {
         width: 650px;
         height: 650px;
         top: -400px;
         left: 50%;
         transform: translateX(-50%);
         background: var(--accent);
         opacity: .18;
      }

      .orb-two {
         width: 450px;
         height: 450px;
         top: 35%;
         left: -300px;
         background: #7c3aed;
         opacity: .09;
      }

      .orb-three {
         width: 500px;
         height: 500px;
         top: 70%;
         right: -300px;
         background: #ff7a00;
         opacity: .07;
      }

      nav {
         position: fixed;
         top: 18px;
         left: 50%;
         transform: translateX(-50%);
         width: min(94%, 1050px);
         z-index: 100;
         display: flex;
         align-items: center;
         padding: 5px 12px 5px 24px;
         border: 1px solid var(--border);
         border-radius: 32px;
         background: var(--surface);
         backdrop-filter: blur(25px);
         -webkit-backdrop-filter: blur(25px);
         box-shadow: 0 10px 40px rgba(0, 0, 0, .08);
      }

      .brand {
         display: flex;
         align-items: center;
         gap: 5px;
         font-size: 16px;
         font-weight: 700;
         letter-spacing: -.02em;
      }

      .nav-link,
      .button-primary {
         color: #fff;
         background: var(--accent);
         box-shadow: 0 12px 30px rgba(250, 45, 72, .25);
      }

      .nav-link {
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
            "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
         padding: 9px 17px;
         border-radius: 999px;
         font-size: 12px;
         font-weight: 700;
      }

      .nav-link:hover,
      .button-primary:hover {
         transform: translateY(-2px);
         box-shadow: 0 17px 38px rgba(250, 45, 72, .35);
      }

      button:disabled {
         display: none;
      }

      .hero {
         width: min(1150px, 92%);
         min-height: 100vh;
         margin: auto;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         text-align: center;
         padding: 150px 0 90px;
      }

      .eyebrow,
      .section-number {
         color: var(--accent);
         font-size: 12px;
         font-weight: 800;
         letter-spacing: .13em;
         text-transform: uppercase;
      }

      .eyebrow {
         display: inline-flex;
         align-items: center;
         gap: 8px;
         margin-bottom: 24px;
      }

      .eyebrow-dot {
         width: 7px;
         height: 7px;
         border-radius: 50%;
         background: var(--accent);
         box-shadow: 0 0 0 5px rgba(250, 45, 72, .1), 0 0 20px rgba(250, 45, 72, .45);
      }

      h1 {
         max-width: min(1150px, 94%);
         font-size: clamp(40px, 7vw, 76px);
         line-height: 1;
         letter-spacing: -.02em;
         font-weight: 800;
      }

      .gradient {
         background: linear-gradient(135deg, var(--accent), var(--accent-light));
         -webkit-background-clip: text;
         background-clip: text;
         -webkit-text-fill-color: transparent;
      }

      .hero-text {
         max-width: 590px;
         margin-top: 32px;
         color: var(--muted);
         font-size: clamp(17px, 2vw, 20px);
         line-height: 1.6;
      }

      .hero-links {
         display: flex;
         flex-wrap: wrap;
         justify-content: center;
         gap: 12px;
         margin-top: 38px;
      }

      .button,
      button {
         min-height: 50px;
         display: inline-flex;
         align-items: center;
         justify-content: center;
         padding: 10px 12px 10px 18px;
         margin: 10px 12px 10px 18px;
         border-radius: 999px;
         font-size: 14px;
         font-weight: 700;
         transition: transform .2s ease, box-shadow .2s ease;
      }

      .buttons {
         display: grid;
         align-items: center;
      }

      .section {
         width: min(1000px, 94%);
         padding: 110px 0 60px;
         margin: auto;
         display: flex;
         flex-wrap: wrap;
         justify-content: center;
      }

      .section-title {
         margin-top: 12px;
         font-size: clamp(40px, 7vw, 76px);
         line-height: .92;
         letter-spacing: -.04em;
      }

      .camera-card {
         width: min(900px, 92%);
         justify-content: center;
         align-items: center;
         margin-top: 30px;
         padding: 10px;
         border: 1px solid var(--border);
         border-radius: 32px;
         background: var(--surface);
         backdrop-filter: blur(30px);
         -webkit-backdrop-filter: blur(30px);
         box-shadow: var(--shadow);
      }

      .camera-card p {
         max-width: 900px;
         color: var(--muted);
         font-size: clamp(17px, 2vw, 20px);
         line-height: 1.75;
      }

      .camera-card p+p {
         margin-top: 24px;
      }

      .camera {
         background: #000;
         display: block;
         border-radius: 18px;
         padding-top: 10px;
      }

      video {
         width: auto;
         height: auto;
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .contact {
         width: min(900px, 92%);
         margin: auto;
         padding: 20px 0 60px;
         text-align: center;
      }

      .contact h2 {
         margin-top: 12px;
         font-size: clamp(48px, 8vw, 90px);
         line-height: .9;
         letter-spacing: -.02ßem;
      }

      .contact p {
         max-width: 530px;
         margin: 24px auto 32px;
         color: var(--muted);
         line-height: 1.6;
      }

      footer {
         width: min(1050px, 92%);
         margin: auto;
         padding: 28px 0 40px;
         border-top: 1px solid var(--border);
         display: flex;
         align-items: center;
         justify-content: space-evenly;
         gap: 5px;
         font-size: 21px;
         color: var(--text);
         font-weight: 600;
         transition: color .2s ease;
      }

      .footer-links {
         display: flex;
         align-items: center;
      }

      :focus-visible {
         outline: 3px solid var(--accent);
         outline-offset: 4px;
      }

      video {
         width: 100%;
         height: Auto;
         display: none;
         border-radius: 18px;
         padding: 18px;
      }

      .preview {
         width: 100%;
         height: Auto;
         border-radius: 18px;
         padding: 18px;
      }

      @media (max-width:700px) {
         nav {
            top: 11px;
         }

         .hero {
            padding-top: 130px;
         }

         h1 {
            font-size: clamp(40px, 7vw, 76px);
         }

         .section {
            padding: 90px 0 60px;
         }

         footer {
            flex-direction: column;
            text-align: center;
         }

         .footer-links {
            display: none;
         }
      }

      @media (prefers-reduced-motion: reduce) {
         html {
            scroll-behavior: auto;
         }

         *,
         *::before {
            transition: none !important;
         }
      }
   </style>
</head>

      <script>
         const camera = document.getElementById("camera");
         const canvas = document.getElementById("canvas");
         const preview = document.getElementById("preview");
         const startCameraButton = document.getElementById("startCamera");
         const takePhotoButton = document.getElementById("takePhoto");
         const retakePhotoButton = document.getElementById("retakePhoto");
         const sendPhotoButton = document.getElementById("sendPhoto");
         const downloadPhotoButton = document.getElementById("downloadPhoto");
         const statusText = document.getElementById("status");

         let stream = null;
         let photoBlob = null;

         const switchCameraButton = document.getElementById("switchCamera");

         let currentCamera = "environment";

         async function startCamera() {
            try {
               stopCamera();

               stream = await navigator.mediaDevices.getUserMedia({
                  video: {
                     facingMode: { ideal: currentCamera }
                  },
                  audio: false
               });

               camera.srcObject = stream;
               camera.style.display = "block";
               preview.style.display = "none";
               startCameraButton.style.display = "none";
               takePhotoButton.disabled = false;
               switchCameraButton.disabled = false;
               statusText.textContent =
                  currentCamera === "environment"
                     ? "Rear camera selected."
                     : "Front camera selected.";
            } catch (error) {
               console.error(error);
               statusText.textContent =
                  "Unable to access the selected camera.";
            }
         }

         async function switchCamera() {
            currentCamera =
               currentCamera === "environment"
                  ? "user"
                  : "environment";

            await startCamera();
         }

         switchCameraButton.addEventListener("click", switchCamera);


         function takePhoto() {
            if (!stream) return;

            const width = camera.videoWidth;
            const height = camera.videoHeight;

            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");
            context.drawImage(camera, 0, 0, width, height);

            canvas.toBlob(
               blob => {
                  photoBlob = blob;
                  preview.src = URL.createObjectURL(blob);

                  switchCameraButton.display = "none";
                  camera.style.display = "none";
                  preview.style.display = "block";
                  canvas.style.display = "none";
                  takePhotoButton.disabled = true;
                  retakePhotoButton.disabled = false;
                  switchCameraButton.disabled = true;
                  sendPhotoButton.disabled = false;
                  downloadPhotoButton.disabled = false;

                  stopCamera();

                  statusText.textContent = "Photo captured.";
               },
               "image/jpeg",
               0.9
            );
         }

         function retakePhoto() {
            photoBlob = null;
            preview.src = "";

            preview.style.display = "none";
            camera.style.display = "block";
            canvas.style.display = "none";
            sendPhotoButton.disabled = true;
            downloadPhotoButton.disabled = true;
            retakePhotoButton.disabled = true;

            startCamera();
         }

         function stopCamera() {
            if (stream) {
               stream.getTracks().forEach(track => track.stop());
               stream = null;
            }
         }

         async function sendPhoto() {
            if (!photoBlob) return;

            const file = new File(
               [photoBlob],
               `photo-${Date.now()}.jpg`,
               { type: "image/jpeg" }
            );

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
               try {
                  await navigator.share({
                     title: "Photo",
                     text: "Attached is the photo.",
                     files: [file]
                  });

                  statusText.textContent = "Share menu opened.";
               } catch (error) {
                  if (error.name !== "AbortError") {
                     statusText.textContent = "Unable to open the share menu.";
                  }
               }
            } else {
               statusText.textContent =
                  "Direct sharing is not supported here. Download the photo and attach it to an email.";
            }
         }

         function downloadPhoto() {
            if (!photoBlob) return;

            const link = document.createElement("a");
            link.href = URL.createObjectURL(photoBlob);
            link.download = `photo-${Date.now()}.jpg`;
            link.click();

            URL.revokeObjectURL(link.href);
         }

         startCameraButton.addEventListener("click", startCamera);
         takePhotoButton.addEventListener("click", takePhoto);
         retakePhotoButton.addEventListener("click", retakePhoto);
         sendPhotoButton.addEventListener("click", sendPhoto);
         downloadPhotoButton.addEventListener("click", downloadPhoto);

         window.addEventListener("beforeunload", stopCamera);
      </script>
